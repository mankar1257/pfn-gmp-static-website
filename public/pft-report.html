<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>PFT — Daily Reports</title>
<style>
:root{--blue:#2563eb;--blue2:#3b82f6;--bg:#f8fafc;--ink:#1e293b;--mut:#64748b;--bd:#e2e8f0;
 --g:#16a34a;--r:#dc2626;--head:#0f172a;--card:#fff;--am:#f97316}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{background:var(--head);color:#fff;padding:.85rem 1.25rem;display:flex;align-items:center;gap:.6rem}
header svg{flex:0 0 auto}header h1{font-size:1.02rem;margin:0;font-weight:600;letter-spacing:.2px}
header .sub{color:#94a3b8;font-size:.78rem;margin-left:auto}
.wrap{max-width:1180px;margin:1.1rem auto;padding:0 1rem}
@media(prefers-reduced-motion:no-preference){.fade{animation:f .25s ease-out}}@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
/* login */
.login{max-width:380px;margin:9vh auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:1.6rem;box-shadow:0 6px 24px rgba(15,23,42,.06)}
.login h2{margin:.2rem 0 1rem;font-size:1.05rem}
.fld{margin-bottom:.8rem}.fld label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:.25rem}
.fld input{width:100%;padding:.6rem .7rem;border:1px solid var(--bd);border-radius:9px;font:inherit}
.fld input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.pw{position:relative}.pw button{position:absolute;right:.4rem;top:.4rem;border:0;background:none;color:var(--mut);cursor:pointer;font-size:.78rem}
.btn{width:100%;padding:.65rem;border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;transition:background .2s}
.btn:hover{background:#1d4ed8}.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--r);font-size:.82rem;min-height:1.1rem;margin-top:.5rem}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:.8rem 1rem}
.card .v{font-size:1.5rem;font-weight:700}.card .k{color:var(--mut);font-size:.78rem;margin-top:.1rem}
/* filters */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;align-items:end;margin-bottom:.8rem}
.filters .f label{display:block;font-size:.72rem;color:var(--mut);margin-bottom:.15rem}
.filters input,.filters select{padding:.4rem .5rem;border:1px solid var(--bd);border-radius:8px;font:inherit}
.filters .ghost{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:.42rem .7rem;cursor:pointer}
/* table */
.tblw{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.87rem}
th,td{padding:.55rem .7rem;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:#f1f5f9;cursor:pointer;user-select:none;font-weight:600;color:#334155;position:sticky;top:0}
th[aria-sort] .ar{color:var(--blue)}
tbody tr:hover td{background:#f8fafc}td.num{text-align:right}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.1rem .55rem;border-radius:99px;font-size:.72rem;font-weight:600}
.pill.traded{background:#dcfce7;color:#166534}.pill.no_trade{background:#fee2e2;color:#991b1b}.pill.no_session{background:#f1f5f9;color:#475569}
.dot{width:6px;height:6px;border-radius:99px;display:inline-block}.dot.traded{background:var(--g)}.dot.no_trade{background:var(--r)}.dot.no_session{background:var(--mut)}
.pos{color:var(--g);font-weight:600}.neg{color:var(--r);font-weight:600}.muted{color:var(--mut)}
.inc{color:var(--am);cursor:pointer;font-weight:600}
.foot{color:var(--mut);font-size:.76rem;margin:.7rem 2px}
.hidden{display:none}
.row{cursor:pointer}.row:focus-within td{background:#eef2ff}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;z-index:50;overflow:auto}
.modal.hidden{display:none}
.sheet{background:#fff;border-radius:14px;max-width:800px;width:100%;padding:1.4rem 1.6rem;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.28)}
@media(prefers-reduced-motion:no-preference){.sheet{animation:sin .2s ease-out}}@keyframes sin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.sheet .x{position:absolute;right:.7rem;top:.45rem;border:0;background:none;font-size:1.6rem;line-height:1;color:var(--mut);cursor:pointer}
.detail h3{margin:.1rem 0 .4rem}.detail .kv{display:flex;gap:1.5rem;flex-wrap:wrap;margin:.7rem 0 1rem}
.detail .kv .muted{font-size:.72rem}.detail .sec{margin:1.1rem 0}
.detail .sec h4{margin:0 0 .4rem;font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.detail .inc-list{margin:0;padding-left:1.1rem}.detail .inc-list li{margin:.25rem 0;color:#9a3412;font-size:.82rem;word-break:break-word}
</style></head><body>

<div id="gate" class="login fade">
  <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="4" height="9"/><rect x="10" y="6" width="4" height="14"/><rect x="17" y="3" width="4" height="17"/></svg>
  <h2>PFT — Daily Reports</h2>
  <form id="lf" autocomplete="off">
    <div class="fld"><label for="u">Username</label><input id="u" type="text" autocomplete="username" required></div>
    <div class="fld"><label for="p">Password</label><div class="pw"><input id="p" type="password" autocomplete="current-password" required><button type="button" id="tg" aria-label="show password">show</button></div></div>
    <button class="btn" id="go" type="submit">Unlock</button>
    <div class="err" id="err" role="alert" aria-live="polite"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="4" height="9"/><rect x="10" y="6" width="4" height="14"/><rect x="17" y="3" width="4" height="17"/></svg>
    <h1>PFT — Daily Trade Execution Reports</h1><span class="sub" id="upd"></span>
  </header>
  <div class="wrap fade">
    <div class="cards" id="cards"></div>
    <div class="filters">
      <div class="f"><label>From</label><input type="date" id="from"></div>
      <div class="f"><label>To</label><input type="date" id="to"></div>
      <div class="f"><label>Outcome</label><select id="oc"><option value="">All</option><option value="traded">Traded</option><option value="no_trade">No-trade</option><option value="no_session">No session</option></select></div>
      <div class="f"><label>Stock</label><input type="text" id="q" placeholder="filter…" size="10"></div>
      <button class="ghost" onclick="reset_()">Reset</button>
    </div>
    <div class="tblw"><table><thead><tr>
      <th data-k="date" aria-sort="descending">Date <span class="ar">▾</span></th><th data-k="outcome">Outcome</th>
      <th data-k="primary_pick">Selected stock</th><th data-k="n_variants_traded" class="num">Trades</th>
      <th class="num">Capital</th><th data-k="realized_pnl" class="num">PnL (₹)</th>
      <th data-k="realized_pnl_pct" class="num">PnL %</th>
      <th>Exit / reason</th><th>Incidents</th></tr></thead><tbody id="body"></tbody></table></div>
    <p class="foot">Confidential — for authorized recipients only. Tip: click any row for the full day report. Data decrypted locally in your browser; nothing is sent to a server.</p>
  </div>
  <div id="modal" class="modal hidden" onclick="if(event.target===this)closeDetail()">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Daily report detail">
      <button class="x" onclick="closeDetail()" aria-label="Close">×</button>
      <div class="detail" id="detail"></div>
    </div>
  </div>
</div>

let DATA=[],sortK="date",dir=-1;
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(u,p){
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:"SHA-256"},
    await crypto.subtle.importKey("raw",new TextEncoder().encode(u+"\n"+p),"PBKDF2",false,["deriveKey"]),
    {name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
$("tg").onclick=()=>{const i=$("p");i.type=i.type==="password"?"text":"password";$("tg").textContent=i.type==="password"?"show":"hide";};
$("lf").addEventListener("submit",async e=>{e.preventDefault();$("err").textContent="";$("go").disabled=true;$("go").textContent="Unlocking…";
  try{const j=await decrypt($("u").value.trim(),$("p").value);DATA=j.days||[];$("upd").textContent="updated "+(j.updated||"");
    $("gate").classList.add("hidden");$("app").classList.remove("hidden");initDates();render();}
  catch(_){$("err").textContent="Incorrect username or password.";$("go").disabled=false;$("go").textContent="Unlock";$("p").select();}});
function initDates(){if(!DATA.length)return;$("from").value=DATA[DATA.length-1].date;$("to").value=DATA[0].date;}
function caps(d){let c=(d.picks||[]).map(x=>x.capital).filter(x=>x);return c.length?"₹"+c.reduce((a,b)=>a+b,0).toLocaleString("en-IN"):"—";}
function picks(d){return (d.picks||[]).map(x=>x.ticker).join(", ")||"—";}
function exitR(d){return (d.picks||[]).map(x=>x.exit_reason).filter(x=>x)[0]||"—";}
function filtered(){let f=$("from").value,t=$("to").value,oc=$("oc").value,q=$("q").value.toUpperCase();
  let a=DATA.filter(d=>(!f||d.date>=f)&&(!t||d.date<=t)&&(!oc||d.outcome===oc)&&(!q||picks(d).toUpperCase().includes(q)));
  a.sort((x,y)=>{let A=x[sortK],B=y[sortK];A=A==null?-1:A;B=B==null?-1:B;return(A>B?1:A<B?-1:0)*dir;});return a;}
function render(){let a=filtered(),traded=a.filter(d=>d.outcome==="traded").length,
  pnl=a.reduce((s,d)=>s+(+d.realized_pnl||0),0),fails=a.reduce((s,d)=>s+(d.n_orders_failed||0),0),
  tcap=a.reduce((s,d)=>s+((d.picks||[]).filter(p=>p.order_status==="placed").reduce((c,p)=>c+(+p.capital||0),0)),0),
  pctTxt=tcap?((pnl/tcap*100>0?"+":"")+(pnl/tcap*100).toFixed(2)+"%"):"—",
  wr=traded?Math.round(a.filter(d=>+d.realized_pnl>0).length/traded*100):0;
  $("cards").innerHTML=card(a.length,"sessions")+card(traded,"traded days")+
    `<div class="card"><div class="v ${pnl>0?'pos':pnl<0?'neg':''}">₹${pnl.toLocaleString("en-IN",{maximumFractionDigits:2})}</div><div class="k">realized PnL</div></div>`+
    `<div class="card"><div class="v ${pnl>0?'pos':pnl<0?'neg':''}">${pctTxt}</div><div class="k">return on capital</div></div>`+
    card(wr+"%","win rate")+card(fails,"order failures");
  $("body").innerHTML=a.map(d=>{let p=+d.realized_pnl||0,oc=d.outcome,inc=(d.incidents||[]).length;
    return `<tr class="row" tabindex="0" onclick="openDetail('${d.date}')" onkeydown="if(event.key==='Enter')openDetail('${d.date}')"><td class="mono">${d.date}</td>
      <td><span class="pill ${oc}"><span class="dot ${oc}"></span>${oc.replace("_"," ")}</span></td>
      <td><b>${d.primary_pick||"—"}</b>${picks(d)!==(d.primary_pick||"")?` <span class="muted">(${picks(d)})</span>`:""}</td>
      <td class="num">${d.n_variants_traded||0}</td><td class="num mono">${caps(d)}</td>
      <td class="num mono ${p>0?'pos':p<0?'neg':''}">${p.toFixed(2)}</td>
      <td class="num mono ${p>0?'pos':p<0?'neg':''}">${d.realized_pnl_pct!=null?(d.realized_pnl_pct>0?"+":"")+d.realized_pnl_pct.toFixed(2)+"%":"—"}</td>
      <td class="muted">${exitR(d).slice(0,42)}</td>
      <td>${inc?`<span class="inc">${inc} ⚠</span>`:"<span class=muted>—</span>"}</td></tr>`;
  }).join("")||'<tr><td colspan=9 class=muted style="padding:1.2rem">No sessions match.</td></tr>';
  document.querySelectorAll("th[data-k]").forEach(th=>{th.removeAttribute("aria-sort");
    let s=th.querySelector(".ar");if(s)s.remove();
    if(th.dataset.k===sortK){th.setAttribute("aria-sort",dir<0?"descending":"ascending");
      th.insertAdjacentHTML("beforeend",` <span class="ar">${dir<0?"▾":"▴"}</span>`);}});}
function card(v,k){return `<div class="card"><div class="v">${v}</div><div class="k">${k}</div></div>`;}
function reset_(){initDates();$("oc").value="";$("q").value="";render();}
document.querySelectorAll("th[data-k]").forEach(th=>th.addEventListener("click",()=>{let k=th.dataset.k;dir=(sortK===k)?-dir:-1;sortK=k;render();}));
["from","to","oc","q"].forEach(id=>$(id).addEventListener("input",render));
function fmtS(s){return s!=null?(+s).toFixed(1)+"s":"—";}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function openDetail(date){const d=DATA.find(x=>x.date===date);if(!d)return;const oc=d.outcome;
  const pr=(d.picks||[]).map(p=>`<tr><td>${p.rank||"—"}</td><td><b>${esc(p.ticker||"—")}</b></td><td>${esc(p.tier||"—")}</td><td class="num mono">${p.conviction!=null?p.conviction:"—"}</td><td class="num mono">${p.capital?"₹"+(+p.capital).toLocaleString("en-IN"):"—"}</td><td>${esc(p.order_status||"—")}</td><td class="num mono">${p.entry!=null?p.entry:"—"}</td><td class="num mono">${p.exit!=null?p.exit:"—"}</td><td class="num mono ${p.pnl>0?'pos':p.pnl<0?'neg':''}">${p.pnl!=null?(+p.pnl).toFixed(2):"—"}</td><td class="num mono ${p.pnl_pct>0?'pos':p.pnl_pct<0?'neg':''}">${p.pnl_pct!=null?(p.pnl_pct>0?"+":"")+p.pnl_pct.toFixed(2)+"%":"—"}</td></tr>`).join("")||'<tr><td colspan=10 class=muted>No picks this day.</td></tr>';
  const il=(d.incidents||[]).map(i=>`<li>${esc(i)}</li>`).join("")||'<li class=muted>None.</li>';
  $("detail").innerHTML=`<h3>Report — ${esc(d.date)}</h3>
   <span class="pill ${oc}"><span class="dot ${oc}"></span>${oc.replace("_"," ")}</span>
   <div class="kv"><div><div class="muted">Primary pick</div><b>${esc(d.primary_pick||"—")}</b></div>
     <div><div class="muted">Trades</div>${d.n_variants_traded||0}</div>
     <div><div class="muted">Orders ok / failed</div>${d.n_orders_placed||0} / ${d.n_orders_failed||0}</div>
     <div><div class="muted">Realized PnL</div><span class="${d.realized_pnl>0?'pos':d.realized_pnl<0?'neg':''}">₹${(+d.realized_pnl||0).toFixed(2)}${d.realized_pnl_pct!=null?" ("+(d.realized_pnl_pct>0?"+":"")+d.realized_pnl_pct.toFixed(2)+"%)":""}</span></div>
     <div><div class="muted">Engine boots</div>${d.engine_boots||0}</div></div>
   <div class="sec"><h4>Picks (selected stocks)</h4><div class="tblw"><table><thead><tr><th>Rank</th><th>Stock</th><th>Tier</th><th class=num>Conv.</th><th class=num>Capital</th><th>Order</th><th class=num>Entry</th><th class=num>Exit</th><th class=num>PnL</th><th class=num>PnL %</th></tr></thead><tbody>${pr}</tbody></table></div></div>
   <div class="sec"><h4>Pipeline timings</h4><div class="kv"><div><div class="muted">feature cache / warmup total</div>${fmtS(d.warmup_cache_s)} / ${fmtS(d.warmup_total_s)}</div><div><div class="muted">selection 5-min refresh</div>${fmtS(d.selection_refresh_s)}</div></div></div>
   <div class="sec"><h4>Incidents</h4><ul class="inc-list">${il}</ul></div>
   <div class="muted" style="font-size:.74rem;margin-top:1rem">generated ${esc(d.generated||"")}</div>`;
  $("modal").classList.remove("hidden");const x=$("modal").querySelector(".x");if(x)x.focus();}
function closeDetail(){$("modal").classList.add("hidden");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail();});
</script></body></html>
